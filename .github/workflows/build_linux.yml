name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev glslang-tools spirv-tools python3 llvm clang

      - name: Eigene DLL aus Release laden & Assets extrahieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download sdk-dll -p "*.dll"
          python3 tools/setup.py --dll amd_fidelityfx_upscaler_dx12.dll

      - name: Build starten
        run: bash tools/build/linux.sh

      - name: Fertige Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: amd_fidelityfx_upscaler_vk-linux
          path: "**/amd_fidelityfx_upscaler_vk.so"
